[build]
  publish = "public"
  # no build step needed: the app is plain HTML + JavaScript

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com https://status.search.google.com https://www.googleapis.com https://chromeuxreport.googleapis.com https://api.stackexchange.com https://*.wikipedia.org https://www.wikidata.org http://localhost:11434 http://127.0.0.1:11434; img-src 'self' data: https:; frame-ancestors 'none'"
